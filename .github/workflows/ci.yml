name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Hygiene gates
        run: ./Scripts/check_hygiene.sh

      - name: Build
        run: swift build

      - name: Build (release)
        run: swift build --configuration release

      - name: Test
        run: swift test
